name: Auto Monitor Schedule

on:
  schedule:
    - cron: "25 8,12,18,22 * * *" # UTC 时间对应北京时间 8:25,12:25,18:25,22:25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      NJU_USERNAME: ${{ secrets.NJU_USERNAME }}
      NJU_PASSWORD: ${{ secrets.NJU_PASSWORD }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Show disk usage before install
      run: df -h

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # 固定为 3.11，确保 ddddocr==1.4.11 有可用轮子
        python-version: '3.11'

    - name: Install system dependencies (Chromium + ChromeDriver + fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver || true
        # 安装常用中文字体，避免 matplotlib 警告并支持中文显示
        sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-wqy-zenhei fonts-wqy-microhei fonts-dejavu-core || true
        # sudo apt-get install -y tesseract-ocr || true # 不再使用
        sudo apt-get clean || true
        sudo fc-cache -fv

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Cleanup pip cache and temp files
      run: |
        python -m pip cache purge || true
        df -h

    - name: Run Auto Monitor (Linux)
      shell: bash
      run: |
        echo "Running Python wrapper"
        python3 src/run_workflow_wrapper.py

    - name: Update README with weekly electricity
      if: always()
      shell: bash
      run: |
        CSV_FILE="data/electricity_data.csv"
        
        if [ ! -f "$CSV_FILE" ]; then
          echo "CSV file not found, skipping README update"
          exit 0
        fi
        
        # 获取过去 7 天每天最后一条记录
        # 兼容逗号分隔和制表符分隔两种格式
        awk -F'[,\t]' '
          NR>1 && NF>=2 {
            # 提取日期部分（前10个字符）
            date = substr($1, 1, 10)
            # 记录每天最后一条数据的值
            num[date] = $2
            unit[date] = $3
          }
          END {
            # 输出所有日期，按日期排序
            n = 0
            for (d in num) {
              n++
              dates[n] = d
            }
            # 冒泡排序
            for (i = 1; i <= n; i++) {
              for (j = i+1; j <= n; j++) {
                if (dates[i] > dates[j]) {
                  tmp = dates[i]
                  dates[i] = dates[j]
                  dates[j] = tmp
                }
              }
            }
            # 只输出最后 7 天
            start = (n > 7) ? n - 6 : 1
            for (i = start; i <= n; i++) {
              d = dates[i]
              printf "%s|%.2f|%s\n", d, num[d], unit[d]
            }
          }
        ' "$CSV_FILE" > /tmp/weekly_data.txt
        
        # 构建 Markdown 表格
        echo "**最近一周电量**" > /tmp/readme_block.md
        echo "" >> /tmp/readme_block.md
        echo "| 日期 | 剩余电量 |" >> /tmp/readme_block.md
        echo "|------|----------|" >> /tmp/readme_block.md
        
        while IFS='|' read -r date num unit; do
          echo "| $date | ${num} ${unit} |" >> /tmp/readme_block.md
        done < /tmp/weekly_data.txt
        
        echo "" >> /tmp/readme_block.md
        echo "_最后更新：$(date -u '+%Y-%m-%d %H:%M' | awk '{print $1+0, $2}')（UTC）_" >> /tmp/readme_block.md
        
        # 替换 README 中标记之间的内容
        if [ -f README.md ]; then
          awk '
            BEGIN { skip = 0 }
            /<!-- ELECTRICITY_WEEK_START -->/ {
              print
              while ((getline line < "/tmp/readme_block.md") > 0) print line
              skip = 1
              next
            }
            /<!-- ELECTRICITY_WEEK_END -->/ { skip = 0; print; next }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md
          echo "README updated successfully"
        else
          echo "README.md not found"
        fi
        
    - name: Commit and push changes
      if: always()
      shell: bash
      env:
        GIT_UPDATE_TOKEN: ${{ secrets.GIT_UPDATE_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        branch=${GITHUB_REF##*/}
        echo "Current branch: $branch"

        # 提交 data/ 目录的变更（如果有）
        git add -A data/ || echo "no data/ changes"
        git commit -m "Auto update: data (run ${GITHUB_RUN_ID})" -q || echo "No data changes to commit"

        # 提交 README 变更（如果有）
        git add README.md || echo "no README changes"
        git commit -m "Auto update: README (run ${GITHUB_RUN_ID})" -q || echo "No README changes to commit"
        
        # 提交 logs/ 目录的变更（如果有）
        git add -A logs/ || echo "no logs/ changes"
        git commit -m "Auto update: logs (run ${GITHUB_RUN_ID})" -q || echo "No logs changes to commit"

        # 使用 token 推送到当前分支
        git remote set-url origin https://x-access-token:${GIT_UPDATE_TOKEN}@github.com/${{ github.repository }}.git
        git push origin "HEAD:$branch" || echo "Push failed"

    - name: Show latest wrapper log
      if: always()
      shell: bash
      run: |
        echo "Logs dir content:";
        ls -lt logs || true
        latest=$(ls -t logs 2>/dev/null | head -n1 || true)
        if [ -n "$latest" ]; then
          echo "---- BEGIN latest log: $latest ----";
          # 输出整个日志文件而不限行数
          cat "logs/$latest" || true
          echo "---- END latest log ----";
        else
          echo "No log files found in ./logs"
        fi

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: nju_electric_monitor-logs-${{ github.run_id }}
        path: |
          logs/**
